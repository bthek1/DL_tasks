project:
  type: website
  # Publication rule: only index.ipynb and digit-initial notebooks are rendered.
  # "p_"-prefixed notebooks are private and never reach _docs or gh-pages.
  #
  # Two traps, both measured (2026-09-21). Do not "simplify" this list:
  #   1. A glob that matches directories ("*" or "**/*") pulls whole
  #      subdirectories in, and the "!" lines below then stop applying to the
  #      files inside them. The per-extension globs are load-bearing.
  #   2. Excluding a file by its exact path (e.g. "!Tax/01_Tax.ipynb") demotes
  #      it to a resource, and Quarto copies the raw .ipynb into _docs. Exclude
  #      by glob only; to hide a numbered notebook, rename it to p_.
  # The .md lines exist for nbdevAuto's CHANGELOG.md, the fleet's only
  # non-notebook page.
  render:
    - "*.ipynb"
    - "**/*.ipynb"
    - "*.md"
    - "**/*.md"
    - "!p_*.ipynb"
    - "!**/p_*.ipynb"

format:
  html:
    author: "Benedict Thekkel"
    # custom.scss holds the rules shared by both modes. It replaces the per-submodule
    # styles.css and must stay listed under both themes, or dark mode loses it.
    # theme-light.scss and theme-dark.scss hold the per-mode colours from Logo.svg.
    theme:
      light: [flatly, custom.scss, theme-light.scss]
      dark: [darkly, custom.scss, theme-dark.scss]
    respect-user-color-scheme: true
    # Default body-width is 800px. Wider gives notebook tables and charts room.
    grid:
      body-width: 1000px
    toc: true
    
# This file is a template. `just copy_quarto` fills bthek1 and DL_tasks from each
# submodule's .gitmodules URL, so every site links to its own GitHub repo. Quarto
# cannot do this itself: a {{< meta >}} shortcode in a navbar or footer href is
# left unexpanded (tested on Quarto 1.10).
website:
  image: "Logo.svg"
  favicon: "favi.svg"
  reader-mode: true
  back-to-top-navigation: true
  page-navigation: true
  twitter-card: true
  open-graph: true
  repo-actions: [edit, issue]
  search:
    location: navbar
    type: overlay

  # The navbar colour is $navbar-bg in the theme files. A `background:` key here
  # would override both modes.
  navbar:
    logo: "Logo.svg"
    logo-alt: "Benedict Thekkel"
    collapse-below: lg
    title: false
    left:

      - text: "Docs"
        menu:
        - text: "Blog"
          href: https://bthek1.github.io/bthek1_blog/
        - text: "Ideas"
          href: https://bthek1.github.io/Ideas/
        - text: "Other"
          href: https://bthek1.github.io/Other/

      - text: "Business"
        menu:
        - text: "Business Docs"
          href: https://bthek1.github.io/Business_docs/
        - text: "Finances"
          href: https://bthek1.github.io/Finances/

      - text: "Web"
