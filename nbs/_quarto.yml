            href: "https://github.com/bthek1/DL_tasks"
          - text: "Report a Bug"
            icon: "bug"
            href: "https://github.com/bthek1/DL_tasks/issues/new"
          - text: "Ask a Question"
            icon: "chat-right-text"
            href: "https://github.com/bthek1/DL_tasks/issues/new"
