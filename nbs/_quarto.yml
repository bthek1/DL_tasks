project:
  type: website
  # Publication rule: only index.ipynb and digit-initial notebooks are rendered.
  # "p_"-prefixed notebooks are private and never reach _docs or gh-pages.
  #
  # Two traps, both measured (2026-09-21). Do not "simplify" this list:
  #   1. A glob that matches directories ("*" or "**/*") pulls whole
  #      subdirectories in, and the "!" lines below then stop applying to the
  #      files inside them. The per-extension globs are load-bearing.
  #   2. Excluding a file by its exact path (e.g. "!Tax/01_Tax.ipynb") demotes
  #      it to a resource, and Quarto copies the raw .ipynb into _docs. Exclude
  #      by glob only; to hide a numbered notebook, rename it to p_.
  # The .md lines exist for nbdevAuto's CHANGELOG.md, the fleet's only
  # non-notebook page.
  render:
    - "*.ipynb"
    - "**/*.ipynb"
    - "*.md"
    - "**/*.md"
    - "!p_*.ipynb"
    - "!**/p_*.ipynb"

