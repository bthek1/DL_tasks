      - icon: linkedin
        href: "https://www.linkedin.com/in/benedict-thekkel/"
        aria-label: Linkedin

  comments: 
    utterances:
      repo: quarto-dev/quarto-web
        
  # Sidebar menu. The "auto" glob matches digit-initial notebooks only, so
  # "p_"-prefixed ones (p_04_Pay.ipynb) stay out of the menu. This is the
  # cosmetic half of the rule; the project.render block above is the half that
  # actually keeps them off the published site.
  sidebar:
    style: floating
    contents:
      - "index.ipynb"
      - auto: "[0-9]*.ipynb"


